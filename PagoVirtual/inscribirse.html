<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscripciones | MiPagoVirtual</title>
<link rel="icon" href="imagen/logo.jpeg"><link rel="stylesheet" href="css/app.css">
</head>


<body>

    <main>

        <div class="page-heading">

            <div>
                <div class="eyebrow">ACTIVIDADES DEL CLUB</div>

                <h1>Inscripciones</h1>

                <p>Completá tus datos para solicitar una inscripción.</p>
            </div>

        </div>

        <section class="content-card">

            <h2>Formulario de inscripción</h2>

            <form data-demo-form>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="nombre">Nombre y apellido</label>
                        <input id="nombre" required placeholder="Nombre completo">
                    </div>

                    <div class="form-group">
                        <label for="dni">DNI / Documento</label>
                        <input id="dni" required pattern="[0-9]{7,8}" placeholder="Solo números">
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoría / Actividad</label>

                        <select id="categoria" required>
                            <option value="">Seleccionar actividad</option>
                            <option>Fútbol Infantil</option>
                            <option>Fútbol Juvenil</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="contacto">Teléfono / Contacto</label>
                        <input id="contacto" type="tel" required placeholder="Ej. 3825-123456">
                    </div>

                </div>

                <button class="btn" type="submit">Enviar inscripción</button>

            </form>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>


</html>
